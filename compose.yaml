services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai_chat
      MONGO_INITDB_ROOT_USERNAME: ai_user
      MONGO_INITDB_ROOT_PASSWORD: ai_pass
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      #- ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mongo_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ai_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: ai_pass
      ME_CONFIG_MONGODB_URL: mongodb://ai_user:ai_pass@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ai_admin_user
      ME_CONFIG_BASICAUTH_PASSWORD: ai_admin_pass
    networks:
      - mongo_net

volumes:
  mongo_data:

networks:
  mongo_net:
    driver: bridge